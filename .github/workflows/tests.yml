name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verificar archivos de test
        run: |
          echo "Archivos DICOM de test:"
          find src/test/resources -name "*.dcm" -ls || echo "No se encontraron archivos DICOM"

      - name: Ejecutar tests
        run: mvn clean test -Dspring.profiles.active=test
        env:
          FILE_STORAGE_PATH: ${{ runner.temp }}/planimrt-test

      - name: Mostrar logs si falla
        if: failure()
        run: |
          echo "=== LOGS DE TESTS FALLIDOS ==="
          cat target/surefire-reports/*.txt 2>/dev/null || echo "No hay logs disponibles"

      - name: Generar reporte de cobertura
        run: mvn jacoco:report
        if: always()

      - name: Publicar resultados de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false