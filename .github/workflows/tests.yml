name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev python3-numpy

      - name: Verificar archivos DICOM
        run: |
          echo "Verificando archivos de test..."
          find src/test/resources -name "*.dcm" -ls || echo "No se encontraron archivos DICOM"

      - name: Ejecutar tests con logs detallados
        run: mvn clean test -X
        continue-on-error: true

      - name: Mostrar logs de fallos
        if: failure()
        run: |
          echo "=== LOGS DE SUREFIRE ==="
          cat target/surefire-reports/*.txt || true
          echo "=== FIN LOGS ==="

      - name: Generar reporte de cobertura
        run: mvn jacoco:report
        if: always()

      - name: Publicar resultados de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit